<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
   
    body{
      align-items: center;
    }
   .flag{
    width: 900px;
    height: 600px;
    position: relative;
    background-color: red;
    border: 5px solid black;
   }
   .flag P{
    text-align: center;
    color: black;
    font-size: 50px;

   }
   
   .flag > div{
    height: 300px;
    width: 100%;
    background-color: yellow;
    position: absolute;
    top: 150px;
   }
  .flag > div>div{
    height: 200px;
    width: 200px;
    border-radius: 50%;
    background-color: rgb(255, 0, 0);
    position: absolute;
    top: 50px;
    left: 350px;
  }

    
  </style>
</head>

Use what you know about combining selectors

<body>
  <div class="flag">
    <p>The Flag of TVK!!</p>
    <div>
      <div>
        <p>of Laos CM</p>
      </div>
    </div>
  </div>

</html>
